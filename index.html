<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VEXORA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%235b6cff%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="gems">💎 <span id="gemCount">0</span></div>
    <div id="toast" role="status"></div>
    <button id="shopBtn" type="button">Toko (B)</button>
  </div>
  <div id="hotbar"></div>
  <div id="touch" hidden>
    <button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">▲</button>
  </div>
  <aside id="shop" hidden>
    <h2>Toko</h2>
    <p class="muted">Harga beli selalu lebih mahal dari harga jual.</p>
    <div id="shopList"></div>
    <button id="resetBtn" type="button" class="danger">Hapus progres</button>
  </aside>
  <div id="help">A/D atau ◀▶ jalan · W/Spasi lompat · Klik: pukul/pasang/tanam · 1-9 pilih item · B toko</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

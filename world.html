<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080612" />
  <title>VEXORA — World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./world.css" />
</head>
<body class="game-page">
  <header class="game-topbar">
    <a class="game-brand" href="./dashboard.html"><span class="game-brand-mark">V</span> VEXORA</a>
    <div class="world-title-wrap"><span class="world-live-dot"></span><strong id="worldName">Loading world…</strong><span id="worldType" class="world-type-pill">NORMAL</span><span id="saveState" class="save-state">SYNCING</span></div>
    <div class="game-actions"><button id="buildMode" class="game-tool active">BUILD</button><button id="saveWorld" class="game-tool">SAVE</button><button id="backHome" class="game-tool">EXIT</button></div>
  </header>

  <main class="game-shell">
    <div id="gameCanvas" class="game-canvas" aria-label="VEXORA 3D world"></div>
    <div class="crosshair" aria-hidden="true"><span></span></div>
    <aside class="game-hud">
      <div class="hud-card player-card"><div class="player-avatar">V</div><div><span class="hud-label">EXPLORER</span><strong id="playerLevel">LEVEL 1</strong><small id="worldCoords">X 0 · Y 3 · Z 0</small></div></div>
      <div class="hud-card core-card"><span class="hud-label">VEXA CORE</span><div class="core-row"><strong>1,240</strong><span>XP</span></div><div class="core-bar"><span id="xpBar"></span></div><small>Next level: 2,000 XP</small></div>
      <div class="hud-card controls-card"><span class="hud-label">CONTROLS</span><p><kbd>WASD</kbd> move <kbd>SPACE</kbd> jump</p><p><kbd>CLICK</kbd> place <kbd>SHIFT</kbd> break</p><p><kbd>DRAG</kbd> camera <kbd>1–6</kbd> select</p></div>
      <div class="hud-card inventory-card"><span class="hud-label">HOTBAR</span><button class="block-choice active" data-block="grass" data-slot="1"><i class="block grass"></i><span>Grass</span><b>∞</b><em>1</em></button><button class="block-choice" data-block="stone" data-slot="2"><i class="block stone"></i><span>Stone</span><b>∞</b><em>2</em></button><button class="block-choice" data-block="crystal" data-slot="3"><i class="block crystal"></i><span>Crystal</span><b>∞</b><em>3</em></button></div>
    </aside>
    <div class="world-status"><span class="status-dot"></span><span id="actionStatus">WORLD ONLINE</span></div>
    <div id="toast" class="game-toast" aria-live="polite"></div>
    <div class="game-tip">VEXORA ONLINE SANDBOX · BUILD · EXPLORE · CREATE</div>
  </main>
  <script type="module" src="./world.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/DDgTvWdb/1c26840c-b04f-43cb-ad6b-936879ce884a.png"><title>VEXORA — Worlds</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./portal-v2.css"><link rel="stylesheet" href="./compact-ui.css"><link rel="stylesheet" href="./vexora-design-v2.css"><link rel="stylesheet" href="./vexora-ui-v3.css"></head><body class="dashboard-page"><header class="topbar"><a class="top-brand" href="./dashboard.html"><div class="mini-mark"><img src="https://i.ibb.co/DDgTvWdb/1c26840c-b04f-43cb-ad6b-936879ce884a.png"></div><strong>VEXORA</strong></a><nav><a href="./dashboard.html">HOME</a><a class="active" href="./worlds.html">WORLDS</a><a href="./profile.html">PROFILE</a></nav><a class="logout-button" href="./dashboard.html">BACK HOME</a></header><main class="dashboard-shell"><section class="dashboard-section"><div class="section-heading"><div><p class="eyebrow">VEXORA WORLDS</p><h1>Discover & create.</h1><p class="dashboard-copy">Browse public worlds, jump into a creation and build something completely yours.</p></div><button id="create" class="primary-button">＋ CREATE WORLD</button></div><div class="world-toolbar"><input id="search" placeholder="Search worlds…"><select id="filter"><option value="all">All modes</option><option value="normal">Normal</option><option value="creative">Creative</option><option value="adventure">Adventure</option></select></div><div id="list" class="world-list"><div class="world-loading">Loading worlds…</div></div></section></main><div id="modal" class="modal-backdrop" hidden><section class="world-modal"><button id="close" class="modal-close">×</button><p class="eyebrow">NEW VEXORA WORLD</p><h2>Create your world.</h2><form id="form" class="world-form"><label>World name<input id="name" maxlength="24" required placeholder="Vexoria"></label><div class="form-grid"><label>Mode<select id="type"><option value="normal">🌎 Normal</option><option value="creative">✨ Creative</option><option value="adventure">⚔️ Adventure</option></select></label><label>Privacy<select id="privacy"><option value="public">🌐 Public</option><option value="private">🔒 Private</option></select></label></div><div id="msg" class="message"></div><button class="primary-button">CREATE WORLD →</button></form></section></div><script>const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let worlds=[];function label(t){return({normal:'🌎 Normal',creative:'✨ Creative',adventure:'⚔️ Adventure'}[t]||t)}function render(){const s=$('search').value.toLowerCase(),f=$('filter').value;const a=worlds.filter(w=>(f==='all'||w.type===f)&&(!s||w.name.toLowerCase().includes(s)||(w.ownerUsername||'').toLowerCase().includes(s)));$('list').innerHTML=a.length?a.map(w=>`<article class="world-card world-card-v2"><div class="world-icon">✦</div><div class="world-info"><strong>${esc(w.name)}</strong><p>${label(w.type)} · ${w.privacy==='public'?'🌐 Public':'🔒 Private'} · @${esc(w.ownerUsername||'unknown')}</p></div><a class="secondary-button world-enter" href="./world.html?id=${encodeURIComponent(w.id)}">ENTER WORLD →</a></article>`).join(''):'<div class="world-error">No worlds match your search.</div>'}async function load(){try{const r=await fetch('/api/worlds',{credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load worlds');worlds=d.worlds||[];render()}catch(e){$('list').innerHTML=`<div class="world-error">${esc(e.message)}</div>`}}async function create(e){e.preventDefault();$('msg').textContent='Creating…';try{const r=await fetch('/api/worlds',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:$('name').value.trim(),type:$('type').value,privacy:$('privacy').value})}),d=await r.json();if(!r.ok)throw Error(d.error);$('modal').hidden=true;$('form').reset();load()}catch(e){$('msg').textContent=e.message}}$('search').oninput=render;$('filter').onchange=render;$('create').onclick=()=>{$('modal').hidden=false;$('name').focus()};$('close').onclick=()=>{$('modal').hidden=true};$('form').onsubmit=create;load();</script></body></html>

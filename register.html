<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171126" />
  <title>VEXORA — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <section class="login-card register-card" aria-label="VEXORA create account">
      <a class="back-link" href="./">← Back to login</a>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span class="gem gem-a"></span><span class="gem gem-b"></span><span class="gem gem-c"></span></div>
        <div><div class="brand-name">VEXORA</div><div class="brand-tagline">BUILD · EXPLORE · CREATE</div></div>
      </div>
      <div class="hero register-hero"><h1>Create your account.</h1><p>Choose your identity before you enter the VEXORA universe.</p></div>
      <form id="registerForm" class="login-form" novalidate>
        <label class="field"><span>Display Name</span><div class="input-wrap"><span class="input-icon">✦</span><input id="displayName" type="text" maxlength="40" placeholder="How players will see you" /></div></label>
        <label class="field"><span>Username</span><div class="input-wrap"><span class="input-icon">@</span><input id="username" type="text" maxlength="20" autocomplete="username" placeholder="3–20 letters, numbers, _" required /></div></label>
        <label class="field"><span>Email</span><div class="input-wrap"><span class="input-icon">✉</span><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div></label>
        <label class="field"><span>Password</span><div class="input-wrap"><span class="input-icon">◆</span><input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required /><button id="togglePassword" class="icon-button" type="button">Show</button></div></label>
        <label class="field"><span>Confirm Password</span><div class="input-wrap"><span class="input-icon">✓</span><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required /></div></label>
        <button class="primary-button" type="submit"><span>CREATE VEXORA ACCOUNT</span><span class="arrow">→</span></button>
        <div id="registerMessage" class="message" role="status" aria-live="polite"></div>
      </form>
      <p class="signup-copy">Already have an account? <a href="./">Sign in</a></p>
      <p class="legal">Your password is securely hashed before it is stored.</p>
    </section>
  </main>
  <script src="./register.js"></script>
</body>
</html>
